name: sahaya
description: "Sahaya - Together We Help. Community help & volunteering app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Uncomment / add these when you wire up real functionality:
  # google_maps_flutter: ^2.9.0     # for real maps (screens 7, 12)
  # geolocator: ^13.0.1             # for current location
  # image_picker: ^1.1.2            # for photo upload (screen 6)
  # firebase_core: ^3.6.0           # backend
  # cloud_firestore: ^5.4.4         # requests / chat data
  # firebase_auth: ^5.3.1           # phone/email/google auth
  # provider: ^6.1.2                # or riverpod/bloc for state mgmt

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

